# every hour, like the backtest: forecast the next 4 hours (and tomorrow once the auction is done),
# score the forecasts whose quarter is known, rebuild the dashboard. one commit per run

name: Live forecast

on:
  schedule:
    - cron: "7 * * * *"     # 00:07, 01:07, ... UTC
  workflow_dispatch:        # the outside scheduler (cron-job.org): every hour at :07, a backup at :37
  push:
    branches: [master]
    paths:                  # dashboard changes only rebuild the site
      - "index.qmd"
      - "backtest.qmd"
      - "R/dashboard_setup.R"
      - "theme.scss"
      - "results/*.csv"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  # skip if this hour's forecast is already saved: the outside scheduler starts a backup run at :37,
  # and github's own timer sometimes starts one late
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - id: check
        run: |
          issue=$(date -u +%Y-%m-%dT%H:00:00Z)
          if [ "${{ github.event_name }}" = "push" ]; then go=true
          elif awk -F, -v i="$issue" 'NR == 1 {for (k = 1; k <= NF; k++) if ($k == "issue") c = k; next}
                                      $c == i {f = 1; exit} END {exit !f}' forecasts/intraday_log.csv; then go=false
          else go=true; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "forecast for the hour from $issue UTC, run = $go"

  forecast:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
    steps:
      # the latest commit, not the one from when the run was queued (late runs can queue up)
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      # the fitted models live in the actions cache, not in the repository. if the cache is gone
      # they are fitted again
      - name: Restore models
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: models
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Forecast and score
        id: live
        if: github.event_name != 'push'
        run: |
          before=$(sha256sum models/models.rds 2>/dev/null || true)
          Rscript scripts/07_live.R
          after=$(sha256sum models/models.rds)
          if [ "$before" != "$after" ]; then echo "refit=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save models
        if: steps.live.outputs.refit == 'true'
        uses: actions/cache/save@v6
        with:
          path: models
          key: models-${{ github.run_id }}

      - name: Commit the forecasts
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts results
          git commit -m "Forecasts made $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          # a short glitch at github can make the push fail: three tries
          for try in 1 2 3; do
            if git pull --rebase origin master && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "saving failed (try $try), trying again in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Build dashboard
        run: |
          quarto render index.qmd
          quarto render backtest.qmd
          mkdir -p _site
          cp index.html backtest.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
