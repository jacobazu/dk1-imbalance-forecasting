# every 3 hours: forecast the next 4 hours (and tomorrow once the auction is done), score the
# forecasts whose quarter is known, rebuild the dashboard. one commit per run

name: Live forecast

on:
  schedule:
    - cron: "7 */3 * * *"   # 00:07, 03:07, ... UTC
  workflow_dispatch:
  push:
    branches: [master]
    paths:                  # dashboard changes only rebuild the site
      - "index.qmd"
      - "theme.scss"
      - "results/*.csv"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      # the fitted models live in the actions cache, not in the repository. if the cache is gone
      # they are fitted again
      - name: Restore models
        if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: models
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Forecast and score
        id: live
        if: github.event_name != 'push'
        run: |
          before=$(sha256sum models/models.rds 2>/dev/null || true)
          Rscript scripts/07_live.R
          after=$(sha256sum models/models.rds)
          if [ "$before" != "$after" ]; then echo "refit=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save models
        if: steps.live.outputs.refit == 'true'
        uses: actions/cache/save@v6
        with:
          path: models
          key: models-${{ github.run_id }}

      - name: Commit the forecasts
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts results
          git commit -m "Forecasts made $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          git pull --rebase origin master
          git push

      - name: Build dashboard
        run: |
          quarto render index.qmd
          mkdir -p _site
          cp index.html _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: forecast
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
