# day-ahead to imbalance, paper trading: positions for tomorrow between 10:30 and 11:55 danish time
# (after the price forecast, before the noon auction), and P&L for the days whose imbalance prices are
# out. the script checks the time itself, so the extra runs only score. one commit per run

name: Day-ahead to imbalance

on:
  schedule:
    - cron: "40 8 * * *"    # 10:40 summer time
    - cron: "40 9 * * *"    # 11:40 summer time, 10:40 winter time
    - cron: "10 10 * * *"   # 11:10 winter time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: da-imbalance
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # the weekly fit lives in the actions cache, like the other models
      - name: Restore models
        uses: actions/cache/restore@v6
        with:
          path: models
          key: da-models-${{ github.run_id }}
          restore-keys: da-models-

      - name: Positions and P&L
        id: run
        run: |
          before=$(sha256sum models/da_models.rds 2>/dev/null || true)
          Rscript scripts/08_da_imbalance.R
          after=$(sha256sum models/da_models.rds)
          if [ "$before" != "$after" ]; then echo "refit=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save models
        if: steps.run.outputs.refit == 'true'
        uses: actions/cache/save@v6
        with:
          path: models
          key: da-models-${{ github.run_id }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts results
          git commit -m "Day-ahead to imbalance $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          git pull --rebase origin master
          git push
