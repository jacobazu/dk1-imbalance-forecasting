# the europe imbalance download on its own, for testing changes to it. the hourly run does the same step
name: Europe imbalance prices

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["scripts/09_europe.R", "R/europe_areas.csv", ".github/workflows/europe.yml"]

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  europe:
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      # github's own ubuntu mirror (azure.archive.ubuntu.com) has been failing to resolve or crawling since late
      # oct 2026 (actions/runner-images#15142), which left the r setup hanging for hours. use other mirrors instead
      - name: Ubuntu mirrors
        run: |
          printf 'http://archive.ubuntu.com/ubuntu/\nhttp://mirrors.edge.kernel.org/ubuntu/\nhttp://ftp.uni-stuttgart.de/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99timeouts
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 15
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Download
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: Rscript scripts/09_europe.R
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/europe_imbalance.csv
          git commit -m "Europe imbalance prices $(date -u '+%F %H:%M') UTC" || echo "Nothing new to commit"
          git pull --rebase origin master && git push
